<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MentalCare PH - Dashboard (iPhone 17 Preview)</title>
<link rel="stylesheet" href="styles_3.css">
</head>
<body>

<div class="stage">
  <div>
    <div class="iphone">
      <div class="screen">
        <div class="dynamic-island"></div>

        <div class="status-bar">
          <span>9:41</span>
          <div class="status-icons">
            <svg width="18" height="12" viewBox="0 0 18 12" fill="none"><rect x="0" y="7" width="3" height="5" rx="0.5" fill="#1b2a35"/><rect x="4.5" y="5" width="3" height="7" rx="0.5" fill="#1b2a35"/><rect x="9" y="3" width="3" height="9" rx="0.5" fill="#1b2a35"/><rect x="13.5" y="0" width="3" height="12" rx="0.5" fill="#1b2a35"/></svg>
            <svg width="16" height="12" viewBox="0 0 16 12" fill="none"><path d="M8 10.5C8.55 10.5 9 10.05 9 9.5C9 8.95 8.55 8.5 8 8.5C7.45 8.5 7 8.95 7 9.5C7 10.05 7.45 10.5 8 10.5Z" fill="#1b2a35"/><path d="M8 6.8C9.1 6.8 10.1 7.2 10.9 7.9L12 6.7C10.9 5.7 9.5 5.1 8 5.1C6.5 5.1 5.1 5.7 4 6.7L5.1 7.9C5.9 7.2 6.9 6.8 8 6.8Z" fill="#1b2a35"/><path d="M8 3.1C10.1 3.1 12 3.9 13.5 5.3L14.6 4.1C12.8 2.4 10.5 1.4 8 1.4C5.5 1.4 3.2 2.4 1.4 4.1L2.5 5.3C4 3.9 5.9 3.1 8 3.1Z" fill="#1b2a35"/></svg>
            <svg width="24" height="12" viewBox="0 0 24 12" fill="none"><rect x="0.5" y="0.5" width="21" height="11" rx="2.5" stroke="#1b2a35"/><rect x="2" y="2" width="16" height="8" rx="1.3" fill="#1b2a35"/><rect x="22.5" y="4" width="1.5" height="4" rx="0.7" fill="#1b2a35"/></svg>
          </div>
        </div>

        <div class="app-content">

          <!-- HEADER -->
          <div class="header-row">
            <div class="greeting-block">
              <div class="good-morning">Good Morning</div>
              <div class="user-name" id="userName">Juana 👋</div>
            </div>
            <div class="header-icons">
              <button class="bell-btn" id="bellBtn" aria-label="Notifications">
                <svg width="19" height="19" viewBox="0 0 24 24" fill="currentColor"><path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.89 2 2 2zm6-6v-5c0-3.07-1.63-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.64 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/></svg>
                <span class="dot" id="bellDot"></span>
              </button>
              <button class="avatar-btn" id="avatarBtn">JD</button>
            </div>
          </div>

          <!-- MOOD CARD -->
          <div class="mood-card">
            <div class="mood-title">TODAY'S MOOD</div>
            <div class="mood-options" id="moodOptions">
              <button class="mood-emoji" data-mood="Sad">😞</button>
              <button class="mood-emoji" data-mood="Low">😕</button>
              <button class="mood-emoji selected" data-mood="Okay">😊</button>
              <button class="mood-emoji" data-mood="Good">😄</button>
              <button class="mood-emoji" data-mood="Great">😆</button>
            </div>
          </div>

          <!-- NEXT APPOINTMENT -->
          <h2 class="section-title">Next Appointment</h2>
          <div class="appt-card">
            <div class="appt-top">
              <div class="appt-avatar">AR</div>
              <div>
                <div class="appt-name">Ms. A. Reyes</div>
                <div class="appt-meta">Aug 14 · 2:00 PM · Virtual</div>
              </div>
            </div>
            <button class="join-btn" id="joinBtn">Join Session</button>
          </div>

          <!-- CONTINUE ASSESSMENT -->
          <h2 class="section-title">Continue assessment</h2>
          <div class="assess-card" id="assessCard">
            <div class="assess-title">Stress &amp; Anxiety Check-in</div>
            <div class="progress-track">
              <div class="progress-fill" id="progressFill" style="width: 60%;"></div>
            </div>
            <div class="progress-label" id="progressLabel">6 of 10 completed</div>
          </div>

          <!-- FOR YOU -->
          <h2 class="section-title">For You</h2>
          <div class="foryou-item" id="foryouItem">
            <div class="foryou-icon">📄</div>
            <div class="foryou-text">5 grounding techniques for stress</div>
          </div>

        </div>

        <!-- TAB BAR -->
        <div class="tab-bar">
          <button class="tab-item active" data-tab="home">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5 12 3l9 6.5"/><path d="M5 10v10a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V10"/></svg>
            <span>Home</span>
          </button>
          <button class="tab-item" data-tab="assess">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
            <span>Assess</span>
          </button>
          <button class="tab-item" data-tab="appts">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
            <span>Appts</span>
          </button>
          <button class="tab-item" data-tab="learn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
            <span>Learn</span>
          </button>
          <button class="tab-item" data-tab="profile">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
            <span>Profile</span>
          </button>
        </div>

        <div class="home-indicator"></div>
      </div>
    </div>

    <div class="caption">MentalCare PH — Dashboard · iPhone 17 preview</div>
  </div>
</div>

<script src="../../prototype-navigation.js"></script>
<script src="script_3.js"></script>
</body>
</html>
