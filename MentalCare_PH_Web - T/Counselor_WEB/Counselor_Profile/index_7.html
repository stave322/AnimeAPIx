<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MentalCare PH - Professional Profile</title>
<link rel="stylesheet" href="styles_7.css">
</head>
<body>

<!-- SIDEBAR -->
<div class="sidebar">
  <div class="sidebar-brand">MentalCare PH</div>

  <div class="sidebar-nav">
    <button class="nav-item" data-page="dashboard"><span class="nav-icon">🏠</span> Dashboard</button>
    <button class="nav-item" data-page="schedule"><span class="nav-icon">📅</span> Schedule</button>
    <button class="nav-item" data-page="clients"><span class="nav-icon">📁</span> Client review</button>
    <button class="nav-item" data-page="notifications"><span class="nav-icon">🔔</span> Notifications</button>
    <button class="nav-item active" data-page="profile"><span class="nav-icon">👤</span> Profile</button>
    <button class="nav-item" data-page="logout"><span class="nav-icon">🚪</span> Log Out</button>
  </div>

  <div class="sidebar-footer">
    <div class="sidebar-avatar">AR</div>
    <div>
      <div class="sidebar-user-name">A. Reyes, RPsy</div>
      <div class="sidebar-user-role">Counselor</div>
    </div>
  </div>
</div>

<!-- MAIN -->
<div class="main">
  <div class="header-row">
    <h1 class="page-title">Professional profile</h1>
  </div>
  <p class="page-sub">Visible to clients when booking appointments</p>

  <form class="card" id="profileForm" novalidate>
    <div class="profile-head">
      <div class="profile-avatar" id="profileAvatar">AR</div>
      <div>
        <h3 id="profileName">Ana Reyes, RPsy</h3>
        <p id="profileLicense">License PRC-0012345</p>
      </div>
    </div>

    <div class="field-grid">
      <div class="field" id="fieldSpecialization">
        <label for="specialization">Specialization</label>
        <input type="text" id="specialization" value="Anxiety, Stress Management">
        <div class="field-error">Please enter at least one specialization.</div>
      </div>

      <div class="field" id="fieldExperience">
        <label for="experience">Years of experience</label>
        <input type="number" id="experience" min="0" max="60" value="6">
        <div class="field-error">Please enter a valid number of years.</div>
      </div>

      <div class="field full" id="fieldAbout">
        <label for="aboutMe">About me</label>
        <textarea id="aboutMe">I help students and young professionals manage stress, anxiety, and academic pressure through evidence-based, client-centered counseling.</textarea>
      </div>
    </div>

    <div class="checkbox-row">
      <input type="checkbox" id="acceptingAppointments" checked>
      <label for="acceptingAppointments">Currently accepting new appointments</label>
    </div>

    <button type="submit" class="save-btn" id="saveBtn">Save changes</button>
  </form>
</div>

<div class="toast" id="toast">Profile updated.</div>

<script src="script_7.js"></script>
<script src="../../prototype-navigation.js"></script>
</body>
</html>
