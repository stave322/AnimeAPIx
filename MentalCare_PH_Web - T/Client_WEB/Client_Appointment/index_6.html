<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MentalCare PH - Book Appointment</title>
<link rel="stylesheet" href="styles_6.css">
</head>
<body>

<!-- NAVBAR -->
<div class="navbar">
  <div class="nav-left">
    <img src="../../../pictures/776639704_28097395019922794_1637696865324547307_n (1).jpg" alt="MentalCare PH logo" class="nav-logo">
    <div class="nav-brand-text">
      <div class="brand">Mental<span>Care</span> PH</div>
      <div class="tagline">MIND. CARE. THRIVE.</div>
    </div>
  </div>

  <ul class="nav-links">
    <li><a href="#" data-page="home">Home</a></li>
    <li><a href="#" data-page="resources">Resources</a></li>
    <li><a href="#" class="active" data-page="appointment">Appointment</a></li>
    <li><a href="#" data-page="assessment">Assesment</a></li>
  </ul>

  <div class="nav-right">
    <button class="bell-btn" id="bellBtn" aria-label="Notifications">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.89 2 2 2zm6-6v-5c0-3.07-1.63-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.64 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/></svg>
      <span class="dot"></span>
    </button>
    <button class="avatar" id="avatarBtn">RY</button>
  </div>
</div>

<!-- MAIN -->
<div class="main">
  <h1 class="page-title">Book a counseling appointment</h1>
  <p class="page-sub">Choose a counselor, then pick an available time slot.</p>

  <div class="booking-grid">
    <!-- LEFT: COUNSELORS -->
    <div class="panel">
      <h2>Available counselors</h2>
      <div id="counselorList"></div>
    </div>

    <!-- RIGHT: DATE / TIME / FORM -->
    <div class="panel">
      <div class="date-header">
        <div class="date-title-wrap">
          <h2 id="dateLabel">Wednesday, August 14</h2>
          <button id="calendarBtn" class="calendar-btn" type="button" aria-label="Pick a date">
            <img src="../../../pictures/calendar (1).png" alt="Calendar picker" />
          </button>
        </div>
      </div>

      <input id="datePicker" type="date" hidden>

      <div id="datePickerModal" class="date-picker-modal" aria-hidden="true">
        <div class="date-picker-panel" role="dialog" aria-modal="true" aria-labelledby="datePickerTitle">
          <div class="date-picker-header">
            <h3 id="datePickerTitle">Select a date</h3>
            <button id="closeDatePicker" class="date-picker-close" type="button" aria-label="Close calendar">×</button>
          </div>
          <input id="datePickerModalInput" type="date" />
          <div class="date-picker-actions">
            <button id="applyDatePicker" class="date-picker-apply" type="button">Done</button>
          </div>
        </div>
      </div>

      <div class="time-slots" id="timeSlots"></div>

      <div class="field">
        <label class="field-label">Session Type</label>
        <select id="sessionType">
          <option value="virtual">Virtual (Video call)</option>
          <option value="phone">Phone call</option>
          <option value="in-person">In-person</option>
        </select>
      </div>

      <div class="field">
        <label class="field-label">Reason for visit (Optional)</label>
        <textarea id="reason" placeholder="Briefly share what you'd like to talk about..."></textarea>
      </div>

      <button class="confirm-btn" id="confirmBtn" disabled>Confirm appointment</button>
      <div class="confirm-msg" id="confirmMsg"></div>
    </div>
  </div>
</div>

<div class="notice-modal hidden" id="appointmentNoticeModal" aria-hidden="true">
  <div class="notice-modal-content">
    <div class="notice-modal-header">
      <h3 id="appointmentNoticeTitle">Appointment status</h3>
      <button class="notice-modal-close" id="closeAppointmentNotice" type="button" aria-label="Close appointment notice">×</button>
    </div>
    <div class="notice-modal-message" id="appointmentNoticeMessage" aria-live="polite"></div>
  </div>
</div>

<script src="script_6.js"></script>
<script src="../../prototype-navigation.js"></script>
</body>
</html>
