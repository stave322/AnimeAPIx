<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MentalCare PH - Virtual Session</title>
<link rel="stylesheet" href="styles_5.css">
</head>
<body>

<!-- SIDEBAR -->
<div class="sidebar">
  <div class="sidebar-brand">MentalCare PH</div>

  <div class="sidebar-nav">
    <button class="nav-item" data-page="dashboard"><span class="nav-icon">🏠</span> Dashboard</button>
    <button class="nav-item" data-page="schedule"><span class="nav-icon">📅</span> Schedule</button>
    <button class="nav-item" data-page="clients"><span class="nav-icon">📁</span> Client review</button>
    <button class="nav-item" data-page="notifications"><span class="nav-icon">🔔</span> Notifications</button>
    <button class="nav-item" data-page="profile"><span class="nav-icon">👤</span> Profile</button>
    <button class="nav-item" data-page="logout"><span class="nav-icon">🚪</span> Log Out</button>
  </div>

  <div class="sidebar-footer">
    <div class="sidebar-avatar">AR</div>
    <div>
      <div class="sidebar-user-name">A. Reyes, RPsy</div>
      <div class="sidebar-user-role">Counselor</div>
    </div>
  </div>
</div>

<!-- MAIN -->
<div class="main">
  <!-- CALL PANEL -->
  <div class="call-panel">
    <div class="avatar-emoji">🙂</div>
    <div class="participant-name">Juana Dela Cruz</div>

    <div class="controls-row">
      <div class="control-btn">
        <button class="control-circle audio" id="audioBtn">
          <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
        </button>
        <span class="control-label" id="audioLabel">Audio on</span>
      </div>

      <div class="control-btn">
        <button class="control-circle end" id="endBtn">
          <svg viewBox="0 0 24 24"><path d="M21.6 15.5a1.9 1.9 0 0 1-.44 1.24l-2.22 2.22a1.9 1.9 0 0 1-2.44.2c-.68-.5-1.72-1.28-2.9-2.14a1.9 1.9 0 0 1-.7-1.44v-1.5a12.6 12.6 0 0 0-6.6 0v1.5a1.9 1.9 0 0 1-.7 1.44c-1.18.86-2.22 1.64-2.9 2.14a1.9 1.9 0 0 1-2.44-.2L2.84 16.7a1.9 1.9 0 0 1 .1-2.72C6.1 11.2 9 10 12 10s5.9 1.2 9.06 3.98a1.9 1.9 0 0 1 .54 1.52z"/></svg>
        </button>
        <span class="control-label">End Call</span>
      </div>

      <div class="control-btn">
        <button class="control-circle video" id="videoBtn">
          <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m22 8-6 4 6 4V8Z"/><rect x="2" y="6" width="14" height="12" rx="2"/></svg>
        </button>
        <span class="control-label" id="videoLabel">Video on</span>
      </div>

      <div class="control-btn">
        <button class="control-circle mute" id="muteBtn">
          <svg viewBox="0 0 24 24"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3z"/><path d="M19 11a7 7 0 0 1-14 0" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/><line x1="12" y1="18" x2="12" y2="22" stroke="#fff" stroke-width="2" stroke-linecap="round"/><line x1="1" y1="1" x2="23" y2="23" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
        <span class="control-label" id="muteLabel">Mute</span>
      </div>
    </div>
  </div>

  <!-- QUICK SESSION NOTES -->
  <div class="notes-panel">
    <div class="notes-title">Quick session notes</div>
    <textarea id="quickNotes" placeholder="Get notes during the session..."></textarea>
    <button class="save-notes-btn" id="saveNotesBtn">Save Notes</button>
    <div class="save-notes-status" id="saveNotesStatus"></div>
  </div>
</div>

<script src="script_5.js"></script>
<script src="../../prototype-navigation.js"></script>
</body>
</html>
